<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshFit | Healthy Living</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7f4;
    color:#333;
}

header{
    background:#2e8b57;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#236b45;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.hero{
    height:70vh;
    background:url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=1200')
    center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero-content{
    background:rgba(0,0,0,0.5);
    padding:30px;
    border-radius:10px;
}

.hero h1{
    font-size:3rem;
}

.products{
    padding:50px 20px;
    text-align:center;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    margin:10px;
}

.card p{
    padding:0 10px;
}

.price{
    color:#2e8b57;
    font-size:1.2rem;
    font-weight:bold;
}

button{
    background:#2e8b57;
    color:white;
    border:none;
    padding:10px 20px;
    margin:15px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#236b45;
}

.cart{
    background:white;
    max-width:500px;
    margin:40px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

footer{
    text-align:center;
    background:#2e8b57;
    color:white;
    padding:15px;
    margin-top:40px;
}
</style>
</head>
<body>

<header>
    <h1>FreshFit</h1>
    <p>Healthy Food For A Healthy Lifestyle</p>
</header>

<nav>
    <a href="#">HomeroductsProducts</a>
    #cartCart</a>
</nav>

<section class="hero">
    <div class="hero-content">
        <h1>Fresh & Healthy Meals</h1>
        <p>Discover nutritious products for everyday wellness.</p>
    </div>
</section>

<section class="products" id="products">
    <h2>Popular Products</h2>

    <div class="product-grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800" alt="Salanic Salad</h3>
            <p>Fresh vegetables packed with nutrients.</p>
            <p class="price">R79.99</p>
            <button onclick="addToCart('Organic Salad',79.99)">
                Add to Cart
            </button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1512621776951-a5714100
            <h3>Fruit Bowl</h3>
            <p>Seasonal fruits full of vitamins.</p>
            <p class="price">R59.99</p>
            <button onclick="addToCart('Fruit Bowl',59.99)">
                Add to Cart
            </button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc         <h3>Green Smoothie</h3>
            <p>Natural energy boost for your day.</p>
            <p class="price">R49.99</p>
            <button onclick="addToCart('Green Smoothie',49.99)">
                Add to Cart
            </button>
        </div>

    </div>
</section>

<div class="cart" id="cart">
    <h2>Shopping Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total: R<span id="total">0.00</span></h3>
</div>

<footer>
    <p>&copy; 2026 FreshFit. All rights reserved.</p>
</footer>

<script>
let cart = [];
let total = 0;

function addToCart(product, price) {
    cart.push({product, price});
    total += price;

    updateCart();

    alert(product + " added to cart!");
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const totalDisplay = document.getElementById("total");

    cartItems.innerHTML = "";

    cart.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.product} - R${item.price.toFixed(2)}`;
        cartItems.appendChild(li);
    });

    totalDisplay.textContent = total.toFixed(2);
}
</script>

</body>
</html>
